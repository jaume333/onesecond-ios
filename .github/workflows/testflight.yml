name: Subir a TestFlight
# Solo se lanza a mano (Actions › «Subir a TestFlight» › Run workflow). No envía nada a revisión de la App Store.
on:
  workflow_dispatch:
jobs:
  testflight:
    runs-on: macos-15
    env:
      KEY_ID: LQFB8QADZB          # ID de la clave «GitHub» (no es secreto)
      ISSUER_ID: a406dc4b-3c03-421b-8bb2-e10b20505f94   # ID del emisor (no es secreto)
    steps:
      - uses: actions/checkout@v4
      - name: Clave de App Store Connect
        env:
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          falta=0
          [ -z "$P8" ] && echo "::error::Falta el secreto APPSTORE_KEY_P8" && falta=1
          [ $falta = 1 ] && exit 1
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.APPSTORE_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Archivar (sin firmar: se firma para distribución al exportar, con los certificados de Apple en la nube)
        run: |
          set -o pipefail
          xcodebuild -project OneSecond.xcodeproj -scheme OneSecond -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/OneSecond.xcarchive archive \
            DEVELOPMENT_TEAM=HFR3795974 CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -40
      - name: Subir a TestFlight
        run: |
          set -o pipefail
          xcodebuild -exportArchive -archivePath build/OneSecond.xcarchive -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tail -40
