name: Subir a TestFlight
# Solo se lanza a mano (Actions › «Subir a TestFlight» › Run workflow). No envía nada a revisión de la App Store.
on:
  workflow_dispatch:
    inputs:
      subir:
        description: "Subir a TestFlight (si no, solo comprueba que se firma bien)"
        type: boolean
        default: true
jobs:
  testflight:
    runs-on: macos-15
    env:
      KEY_ID: LQFB8QADZB          # ID de la clave «GitHub» (no es secreto)
      ISSUER_ID: a406dc4b-3c03-421b-8bb2-e10b20505f94   # ID del emisor (no es secreto)
    steps:
      - uses: actions/checkout@v4
      - name: Usar Xcode 26 (Apple lo exige para subir apps)
        run: |
          ls -d /Applications/Xcode*.app
          X=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$X"
          xcodebuild -version
      - name: Clave de App Store Connect
        env:
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          falta=0
          [ -z "$P8" ] && echo "::error::Falta el secreto APPSTORE_KEY_P8" && falta=1
          [ $falta = 1 ] && exit 1
          mkdir -p "$RUNNER_TEMP/keys"
          echo "${{ secrets.APPSTORE_KEY_P8 }}" > "$RUNNER_TEMP/keys/AuthKey.p8"
      - name: Generar el proyecto
        run: |
          brew install xcodegen
          xcodegen generate
      - name: "Archivar (sin firmar; se firma para distribución al exportar)"
        run: |
          set -o pipefail
          xcodebuild -project OneSecond.xcodeproj -scheme OneSecond -sdk iphoneos -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/OneSecond.xcarchive archive \
            DEVELOPMENT_TEAM=HFR3795974 CODE_SIGN_STYLE=Automatic CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" 2>&1 | tail -40
      - name: "Poner los permisos de la app (Iniciar sesión con Apple) en lo archivado"
        run: |
          APP=$(ls -d build/OneSecond.xcarchive/Products/Applications/*.app)
          codesign -f -s - --entitlements OneSecond/OneSecond.entitlements "$APP"
          codesign -d --entitlements - "$APP"
      - name: "Subir a TestFlight (o solo exportar para comprobar)"
        run: |
          set -o pipefail
          cp ExportOptions.plist build/Opciones.plist
          if [ "${{ inputs.subir }}" != "true" ]; then
            /usr/libexec/PlistBuddy -c "Set :destination export" build/Opciones.plist
          fi
          xcodebuild -exportArchive -archivePath build/OneSecond.xcarchive -exportOptionsPlist build/Opciones.plist \
            -exportPath build/export -allowProvisioningUpdates -authenticationKeyPath "$RUNNER_TEMP/keys/AuthKey.p8" \
            -authenticationKeyID "$KEY_ID" -authenticationKeyIssuerID "$ISSUER_ID" 2>&1 | tail -40
      - name: Comprobar los permisos de la app firmada
        if: ${{ inputs.subir != true }}
        run: |
          cd build/export && unzip -oq *.ipa
          codesign -d --entitlements - Payload/*.app
