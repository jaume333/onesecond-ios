name: Estado en App Store Connect
# Solo mira (no cambia nada): en qué estado están las versiones de la app y las compilaciones.
on:
  workflow_dispatch:
jobs:
  estado:
    runs-on: ubuntu-latest
    env:
      KEY_ID: LQFB8QADZB
      ISSUER_ID: a406dc4b-3c03-421b-8bb2-e10b20505f94
      APP: "6832263265"
    steps:
      - name: Mirar
        env:
          P8: ${{ secrets.APPSTORE_KEY_P8 }}
        run: |
          pip install -q pyjwt cryptography requests
          python3 - <<'PY'
          import os, time, jwt, requests
          tok = jwt.encode({"iss": os.environ["ISSUER_ID"], "iat": int(time.time()), "exp": int(time.time()) + 600, "aud": "appstoreconnect-v1"},
                           os.environ["P8"], algorithm="ES256", headers={"kid": os.environ["KEY_ID"], "typ": "JWT"})
          h = {"Authorization": "Bearer " + tok}
          app = os.environ["APP"]
          r = requests.get(f"https://api.appstoreconnect.apple.com/v1/apps/{app}/appStoreVersions?limit=10", headers=h).json()
          for v in r.get("data", []):
              a = v["attributes"]
              print("VERSION", a.get("versionString"), "|", a.get("appStoreState") or a.get("appVersionState"), "|", a.get("releaseType"), "|", a.get("createdDate"))
          r = requests.get(f"https://api.appstoreconnect.apple.com/v1/reviewSubmissions?filter[app]={app}&limit=5", headers=h).json()
          for s in r.get("data", []):
              a = s["attributes"]
              print("ENVIO", a.get("state"), "|", a.get("submittedDate"), "|", a.get("platform"))
          PY
